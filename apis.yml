aid: zervant
name: Zervant
description: 'Zervant is an online invoicing and billing platform for freelancers, sole
  traders, and small businesses. It lets users create, send, and manage estimates and
  invoices online, automate recurring invoices and payment reminders, track time and
  expenses, and get paid online across free and paid subscription tiers. Founded in
  Espoo, Finland and now part of the Ageras group, Zervant is a Northzone portfolio
  company. No public developer API is currently documented — this profile captures the
  company identity and a domain-security probe.'
